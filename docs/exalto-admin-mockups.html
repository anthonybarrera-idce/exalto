<title>Exalto Admin Mockups</title>
<style>
/* shadcn/ui (zinc, light) look-alike for Figma import. 1440x900 desktop screens. */
:root{--bg:#fff;--fg:#09090b;--muted:#f4f4f5;--mfg:#71717a;--border:#e4e4e7;--primary:#18181b;--pfg:#fafafa;--dest:#dc2626;--side:#fafafa;--ring:#a1a1aa;--cyan:#04C1FF;--amber:#EEA246;--green:#16a34a;--yellow:#ca8a04}
*{box-sizing:border-box}
body{margin:0;background:#e9e9ec;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--fg);padding:40px;display:flex;flex-direction:column;gap:60px}
.screen{width:1440px;height:900px;background:var(--bg);display:flex;overflow:hidden;position:relative;border-radius:12px}
.side{width:248px;flex:none;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px}
.brand{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px}
.logo-slot{width:24px;height:28px;flex:none}
.brand b{font-size:14px;font-weight:600;display:block}.brand small{font-size:12px;color:var(--mfg)}
.grp{font-size:12px;color:var(--mfg);font-weight:500;padding:12px 8px 4px}
.nav{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:6px;font-size:14px;color:#3f3f46}
.nav.on{background:#ececee;color:var(--fg);font-weight:500}
.nav .ct{margin-left:auto;font-size:11px;font-weight:600;background:var(--primary);color:#fff;border-radius:6px;padding:1px 6px}
.side .foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px}
.crumb{display:flex;gap:8px;align-items:center;color:var(--mfg);font-size:14px}.crumb b{color:var(--fg);font-weight:500}
.vsep{width:1px;height:16px;background:var(--border)}
.content{flex:1;padding:24px;display:flex;flex-direction:column;gap:20px;overflow:hidden;min-height:0}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.desc{color:var(--mfg);font-size:14px;margin:2px 0 0}
.ph{display:flex;align-items:flex-end;gap:12px}.ph .sp{flex:1}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:14px;height:14px}.ic.l{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:6px;font-size:14px;font-weight:500;background:var(--primary);color:var(--pfg);border:1px solid var(--primary);white-space:nowrap}
.btn.o{background:#fff;color:var(--fg);border-color:var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn.g{background:transparent;color:var(--fg);border-color:transparent}
.btn.d{background:var(--dest);border-color:var(--dest)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.icon{width:32px;padding:0;justify-content:center;height:32px}
.input{height:36px;border:1px solid var(--border);border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mfg);font-size:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.input.v{color:var(--fg)}.input.area{height:auto;align-items:flex-start;padding:8px 12px;min-height:80px}
.label{font-size:14px;font-weight:500}
.field{display:flex;flex-direction:column;gap:8px}
.hint{font-size:13px;color:var(--mfg)}
.card{border:1px solid var(--border);border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);display:flex;flex-direction:column}
.ch{padding:20px 20px 0;display:flex;flex-direction:column;gap:4px}.ch h3{margin:0;font-size:16px;font-weight:600}.ch p{margin:0;color:var(--mfg);font-size:14px}
.cb{padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;min-width:0}.grow{flex:1;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat .cb{gap:4px}.stat .k{display:flex;justify-content:space-between;color:var(--mfg);font-size:14px;font-weight:500}.stat .v{font-size:26px;font-weight:700;letter-spacing:-.02em}.stat .d{font-size:12px;color:var(--mfg)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap;background:var(--primary);color:#fff}
.badge.s{background:var(--muted);color:var(--fg)}.badge.o{background:#fff;color:var(--fg);border-color:var(--border)}
.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef9c3;color:#854d0e}.badge.bad{background:#fee2e2;color:#991b1b}.badge.info{background:#e0f7ff;color:#075985}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--mfg);height:40px;padding:0 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:0 12px;height:52px;border-bottom:1px solid var(--border);white-space:nowrap}
tr.sel td{background:#f4f4f5}
.tw{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cbx{width:16px;height:16px;border:1px solid #a1a1aa;border-radius:4px;display:inline-grid;place-items:center;flex:none}.cbx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.av{width:32px;height:32px;border-radius:50%;background:#e4e4e7;display:grid;place-items:center;font-size:12px;font-weight:600;color:#3f3f46;flex:none}
.av.c{background:linear-gradient(135deg,#04C1FF,#EEA246);color:#fff}
.tabs{display:inline-flex;background:var(--muted);border-radius:8px;padding:3px;gap:2px}
.tabs span{padding:5px 12px;border-radius:6px;font-size:14px;font-weight:500;color:var(--mfg)}.tabs span.on{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:36px;height:20px;border-radius:999px;background:#e4e4e7;position:relative;flex:none}.sw::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}.sw.on{background:var(--primary)}.sw.on::after{left:18px}
.sel-f{justify-content:space-between;color:var(--fg)}
.pag{display:flex;align-items:center;justify-content:space-between;color:var(--mfg);font-size:14px}
.menu{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;width:220px;display:flex;flex-direction:column;font-size:14px;z-index:5}
.menu .mi{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:4px}.menu .mi.h{background:var(--muted)}.menu .lbl{font-size:12px;color:var(--mfg);font-weight:500;padding:6px 8px}.menu .sepm{height:1px;background:var(--border);margin:4px -4px}.menu .red{color:var(--dest)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:4}
.dialog{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:#fff;border-radius:12px;border:1px solid var(--border);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0;font-size:18px;font-weight:600}
.sheet{position:absolute;z-index:5;right:0;top:0;bottom:0;width:480px;background:#fff;border-left:1px solid var(--border);padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.sep{height:1px;background:var(--border);flex:none}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:14px}.kv span:nth-child(odd){color:var(--mfg)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;border-bottom:1px solid var(--border)}
.chart i{flex:1;border-radius:4px 4px 0 0;background:var(--primary)}.chart i.b{background:#d4d4d8}
.xl{display:flex;gap:10px;font-size:12px;color:var(--mfg)}.xl span{flex:1;text-align:center}
.blk{border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.blk .bh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.blk p{margin:0;font-size:14px;line-height:1.6;color:#27272a}
.alert{border:1px solid var(--border);border-radius:8px;padding:12px 14px;display:flex;gap:10px;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{border:1px solid var(--border);border-radius:8px;min-height:86px;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.cal .d .n{color:var(--mfg);font-weight:500}.cal .d.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal .ev{background:var(--muted);border-radius:4px;padding:3px 6px;font-weight:500;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.c{background:#e0f7ff;color:#075985}
.prog{height:8px;background:var(--muted);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:var(--primary)}
.muted{color:var(--mfg)}.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.title-cap{font:600 18px Inter,sans-serif;color:#3f3f46;margin-bottom:-44px}
</style>
<div id="app"></div>
<script>
const P={
dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
book:'<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5zM4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>',
layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0M12 19v3"/>',
star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',
scroll:'<path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
plus:'<path d="M12 5v14M5 12h14"/>', more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
chev:'<path d="m6 9 6 6 6-6"/>', chevr:'<path d="m9 18 6-6-6-6"/>', chevl:'<path d="m15 18-6-6 6-6"/>', updown:'<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>',
filter:'<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>', dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>', up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
check:'<path d="M20 6 9 17l-5-5"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>', eye:'<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>', trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>', shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>', file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/>',
grip:'<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>', arrowu:'<path d="M7 17 17 7M7 7h10v10"/>', play:'<path d="m6 3 14 9-14 9z"/>',
alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>', db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>', globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>'
};
const I=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
const NAV=[['Overview',[['dash','Dashboard']]],['Content',[['book','Hymns'],['layers','Hymnals'],['mic','Recordings'],['star','Featured']]],['Community',[['users','Users'],['inbox','Composer requests','4'],['flag','Reports','7']]],['System',[['scroll','Audit log'],['gear','Settings']]]];
const side=on=>`<aside class="side"><div class="brand"><div class="logo-slot"></div><div><b>Exalto Admin</b><small>IDC Elgin</small></div><span style="margin-left:auto" class="muted">${I('updown','s')}</span></div>${NAV.map(([g,items])=>`<div class="grp">${g}</div>${items.map(([i,t,c])=>`<div class="nav ${t===on?'on':''}">${I(i)}<span>${t}</span>${c?`<span class="ct">${c}</span>`:''}</div>`).join('')}`).join('')}<div class="foot"><div class="av c">AB</div><div class="grow"><div style="font-size:14px;font-weight:600">Anthony Barrera</div><div class="muted" style="font-size:12px">Owner</div></div><span class="muted">${I('updown','s')}</span></div></aside>`;
const top=(...c)=>`<div class="top"><span class="muted">${I('panel')}</span><div class="vsep"></div><div class="crumb">${c.map((x,i)=>i===c.length-1?`<b>${x}</b>`:`<span>${x}</span>${I('chevr','s')}`).join('')}</div><div style="flex:1"></div><div class="input" style="width:260px">${I('search')}<span>Search…</span><span style="margin-left:auto" class="badge o mono">⌘K</span></div></div>`;
const screen=(name,on,crumbs,content,extra='')=>`<div class="title-cap">${name}</div><div class="screen" data-name="${name}">${side(on)}<div class="main">${top(...crumbs)}<div class="content">${content}</div></div>${extra}</div>`;
const stat=(k,ic,v,d)=>`<div class="card stat"><div class="cb"><div class="k"><span>${k}</span>${I(ic)}</div><div class="v">${v}</div><div class="d">${d}</div></div></div>`;
const status={Published:'ok',Draft:'s',Review:'warn',Hidden:'bad'};
const B=(t,c)=>`<span class="badge ${c}">${t}</span>`;

const hymns=[[0,'Himno de Bienvenida','IDC Himnario','Published',1,'Nov 2'],[1,'Porque vive él','IDC Himnario','Published',3,'Nov 10'],[2,'Cuán grande es Él','IDC Himnario','Published',2,'Oct 28'],[3,'Santo, santo, santo','IDC Himnario','Published',1,'Oct 21'],[12,'Sublime gracia','IDC Himnario','Draft',0,'Nov 12'],['—','Te exaltaré','Community','Published',1,'Nov 11'],['—','Luz de mi alma','Community','Review',1,'Nov 13'],[47,'A Dios sea la gloria','IDC Himnario','Published',2,'Sep 30'],[88,'Bendito Redentor','IDC Himnario','Hidden',1,'Sep 14'],['—','Cerca de ti','Community','Published',2,'Nov 4']];

const S=[];
// 1 Dashboard
S.push(screen('01 · Dashboard','Dashboard',['Overview','Dashboard'],`
<div class="ph"><div><h1>Dashboard</h1><p class="desc">What's happening in Exalto this week.</p></div><div class="sp"></div><div class="tabs"><span>7 days</span><span class="on">28 days</span><span>90 days</span></div><button class="btn o sm">${I('dl')} Export</button></div>
<div class="grid4">${stat('Active listeners','users','3,482','+12.4% from last period')}${stat('Hymn plays','play','41,209','+8.1% from last period')}${stat('Published hymns','book','318','280 official · 38 community')}${stat('Needs review','alert','11','4 composer requests · 7 reports')}</div>
<div style="display:grid;grid-template-columns:1.6fr 1fr;gap:16px">
<div class="card"><div class="ch"><h3>Plays per week</h3><p>Hymn book reads and audio plays combined</p></div><div class="cb"><div class="chart">${[42,55,48,60,58,72,66,80,74,88,84,96].map((h,i)=>`<i style="height:${h}%" class="${i<6?'b':''}"></i>`).join('')}</div><div class="xl">${['Aug 24','','Sep 7','','Sep 21','','Oct 5','','Oct 19','','Nov 2',''].map(x=>`<span>${x}</span>`).join('')}</div></div></div>
<div class="card"><div class="ch"><h3>Needs your attention</h3><p>Oldest first</p></div><div class="cb" style="gap:12px">
${[['flag','Copyright report on "Luz de mi alma"','2 reports · 3h ago','bad','Report'],['inbox','Marta Rivera wants composer access','Requested yesterday','warn','Request'],['book','"Luz de mi alma" waiting for review','Submitted 1h ago','warn','Review'],['inbox','Daniel Peña wants composer access','Requested 2d ago','warn','Request']].map(([i,t,s,c,b])=>`<div class="row"><span class="muted">${I(i)}</span><div class="grow"><div style="font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div><div class="muted" style="font-size:13px">${s}</div></div>${B(b,c)}</div>`).join('')}
<button class="btn o sm" style="align-self:flex-start">View queue ${I('chevr','s')}</button></div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
<div class="card"><div class="ch"><h3>Top hymns</h3></div><div class="cb" style="gap:10px">${[['Porque vive él',2410],['Cuán grande es Él',1980],['Te exaltaré',1203]].map(([t,n],i)=>`<div class="row"><span class="muted mono" style="width:16px">${i+1}</span><span class="grow" style="font-weight:500">${t}</span><div class="prog" style="width:180px"><i style="width:${n/24.1}%"></i></div><span class="mono" style="width:48px;text-align:right">${n.toLocaleString()}</span></div>`).join('')}</div></div>
<div class="card"><div class="ch"><h3>New sign-ups</h3></div><div class="cb" style="gap:10px">${[['RL','Ruth López','Listener','12m ago'],['JM','José Martínez','Listener','1h ago'],['MR','Marta Rivera','Composer (pending)','1d ago']].map(([a,n,r,t])=>`<div class="row"><div class="av">${a}</div><div class="grow"><div style="font-weight:500">${n}</div><div class="muted" style="font-size:13px">${r}</div></div><span class="muted" style="font-size:13px">${t}</span></div>`).join('')}</div></div></div>`));

// 2 Hymns
S.push(screen('02 · Hymns','Hymns',['Content','Hymns'],`
