<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: studio: https://*.googleusercontent.com https://firebasestorage.googleapis.com; media-src studio:; font-src 'self' data:; connect-src 'self' ws: studio: https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebasestorage.googleapis.com https://firebasevertexai.googleapis.com" />
    <title>Exalto Hymn Studio</title>
    <script>
      // Paint the right theme before React loads (no white flash in dark mode).
      try {
        const m = localStorage.getItem("theme") || "system"
        const dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
